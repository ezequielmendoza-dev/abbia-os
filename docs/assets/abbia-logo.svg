<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="skyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="260" height="260" rx="36" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

  <!-- ==================== PRISMA DELTA ==================== -->
  <g transform="translate(10, 8)">
    <!-- Outer Triangle Left Diagonal -->
    <line x1="120" y1="36" x2="35" y2="195" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#skyGlow)"/>
    <!-- Inner Triangle Left Diagonal -->
    <line x1="120" y1="54" x2="48" y2="195" stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

    <!-- Outer Triangle Right Diagonal -->
    <line x1="120" y1="36" x2="205" y2="195" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#skyGlow)"/>
    <!-- Inner Triangle Right Diagonal -->
    <line x1="120" y1="54" x2="192" y2="195" stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

    <!-- Apex Top Arrow Marker -->
    <polygon points="120,24 114,35 126,35" fill="#38bdf8" filter="url(#skyGlow)"/>

    <!-- Middle Crossbar (Double line) -->
    <!-- Left Segment -->
    <line x1="78" y1="120" x2="108" y2="120" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="78" y1="128" x2="108" y2="128" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Right Segment -->
    <line x1="132" y1="120" x2="162" y2="120" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="132" y1="128" x2="162" y2="128" stroke="#34d399" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Middle Stage Nodes -->
    <circle cx="78" cy="124" r="8" fill="#34d399" stroke="#065f46" stroke-width="2"/>
    <circle cx="162" cy="124" r="8" fill="#34d399" stroke="#065f46" stroke-width="2"/>

    <!-- Center Memory Core Diamond -->
    <polygon points="120,113 131,124 120,135 109,124" fill="url(#purpleGrad)" stroke="#e9d5ff" stroke-width="1.5" filter="url(#purpleGlow)"/>

    <!-- Base Crossbar (Double Line) -->
    <line x1="35" y1="191" x2="205" y2="191" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="199" x2="205" y2="199" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>

    <!-- Base Corner Nodes -->
    <circle cx="35" cy="195" r="9" fill="#34d399" stroke="#065f46" stroke-width="2"/>
    <circle cx="205" cy="195" r="9" fill="#34d399" stroke="#065f46" stroke-width="2"/>
  </g>
</svg>
